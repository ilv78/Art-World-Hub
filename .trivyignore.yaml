# Trivy v2 policy-format ignore file.
# Supersedes the legacy classic `.trivyignore`, which has been removed.
# Trivy's --ignorefile accepts a single file, so we unify here.
#
# Last reviewed: 2026-09-11 (issue #739) — EMPTY ON PURPOSE.
#
# ─── Why this file is empty ─────────────────────────────────────────
# It held 50 hand-written suppressions, accumulated over #540, #612,
# #635, #649, #670 and #710. All 50 were pruned in #739 after a scan of
# the production image with this file not applied showed that every one
# of them was redundant:
#
#   * 32 are now classified as vendored by `script/partition-trivy.mjs`
#     (#728) — 10 in the npm CLI bundled in the base image, 22 in the
#     esbuild Go binary bundled inside drizzle-kit. The partitioner
#     reports these as warnings and never fails the build, so a
#     suppression adds nothing but an expiry date to forget.
#   * 18 were dead entries suppressing findings the gate no longer sees:
#     12 no longer present in the image at any severity (the base image's
#     npm bundle moved on; top-level esbuild is 0.28.2, past the
#     GHSA-gv7w-rqvm-qjhr range), and 6 still present but rated MEDIUM,
#     below the CRITICAL/HIGH threshold the scan runs at — and on the
#     drizzle-kit binary, so vendored if they are ever re-rated.
#
# ─── Before adding anything here, read this ─────────────────────────
# This file is the last resort, not the first. In order:
#
#   1. Can we upgrade it? Bump the lockfile, add an npm `override`, or
#      add an `--only-upgrade` to the Dockerfile (how libgnutls30 was
#      actually fixed in #710). Do that instead.
#   2. Is it vendored inside something we cannot version? Add a path
#      glob to `.github/trivy-vendored-paths.json` — one pattern covers
#      every future disclosure against that path, with no expiry date.
#      That is what the 32 entries above were replaced by.
#   3. Only if neither applies — a CVE in code we control that we have
#      judged non-exploitable — add an entry here, with `paths:`, a
#      `statement`, and an `expired_at`. Expect to justify it.
#
# An entry here means "we can fix this and are choosing not to, for now."
# It should be rare enough to be uncomfortable. See
# `specs/SECURITY_AGENT.md` §6 and the postmortem
# `docs/postmortems/2026-09-10-trivy-scan-blocked-staging-61-days.md`.
#
# ─── If `statement` names an external fix, prove it ─────────────────
# "Fixed once X rebuilds" / "waiting on upstream" / "the real fix is
# issue #NNN" is a promise about someone else's future action, and #731
# is what happens when that promise is never checked: five libgnutls30
# entries named #629 ("base-image rebuild") as the fix, and it never
# shipped. `node:25-bookworm-slim` was still on `3.7.9-2+deb12u6` months
# after `3.7.9-2+deb12u7` was available in Debian bookworm. Anyone who
# picked up #629 would have rebuilt, seen no change, and had no
# documented next step — the working fix, a targeted
# `apt-get install --only-upgrade`, was available the entire time.
#
# So a `statement` that names an external fix as the reason an entry is
# temporary must also say, in the statement text itself:
#
#   1. How you confirmed the fix is available *right now* — the exact
#      upstream version, and where you checked it (package repo,
#      changelog, release page) — not "should be out by now."
#   2. The fallback if upstream still hasn't shipped by `expired_at` —
#      a concrete alternative action, not "re-review and extend."
#
# A statement that names the external fix and nothing else is
# incomplete. See `specs/SECURITY_AGENT.md` §6.

vulnerabilities: []
