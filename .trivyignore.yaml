  # ─── NEW: esbuild Deno binary-integrity advisory (issue #649) ────
  # GHSA-gv7w-rqvm-qjhr: esbuild's install-time binary integrity check
  # is bypassable specifically when running under the Deno runtime.
  # Flagged on every esbuild copy in the image (<0.28.1): top-level
  # 0.28.0, drizzle-kit's 0.25.12, and esm-loader/tsx's 0.27.4 — hence
  # global rather than path-scoped (genuinely affects every copy).
  #
  # Reachability: our image ships no Deno runtime; esbuild is invoked
  # only at build time via Node. The Deno-specific code path does not
  # execute. Revisit when esbuild >= 0.28.1 lands across the tree
  # (top-level + drizzle-kit + tsx transitive copies).

  - id: GHSA-gv7w-rqvm-qjhr
    statement: "Deno-specific esbuild install integrity bypass. Not reachable: image has no Deno runtime, esbuild runs at build time via Node. Affects all esbuild copies <0.28.1. Revisit when esbuild >= 0.28.1 lands across the tree."
    expired_at: 2026-10-23

