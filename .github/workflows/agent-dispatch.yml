name: Agent Dispatch

# Applying `agent-ready` to an issue starts an autonomous run (#753).
#
# #744 removed the plan-approval step; it did not remove the need for a human to
# start the session. This is that trigger. Without it the developer still spends a
# session per issue no matter how good the policy file gets, which is the cost the
# whole policy exists to remove.
#
# WHAT DECIDES WHETHER THIS RUNS. Four guards, each from a specific failure:
#
#   1. the label must be `agent-ready`             — event filter
#   2. a *human* must have applied it              — an agent that can self-label
#                                                    grants itself Tier B, and the
#                                                    tier boundary becomes decorative
#   3. the issue must not already be claimed       — AGENT-PIPELINE.md §3: stop, do
#                                                    not race another run
#   4. the daily ceiling must not be reached       — a runaway loop plus an unbounded
#                                                    dispatcher is an invoice
#
# Known limit, the same one the gated-path check documents: an agent acting with the
# developer's own credentials is indistinguishable from the developer. Guard 2 rejects
# *bot* accounts, not impersonation.
#
# This file is a self-guarded path in script/gated-paths.mjs. It is the most
# authority-granting file in the repository — editing it changes what starts an
# unattended agent — so changing it costs a human label.

on:
  issues:
    types: [labeled]
  # The sweep (#788). GitHub holds one running and one pending run per
  # concurrency group; a third arrival cancels the pending one before any step
  # runs, leaving `agent-ready` with no claim, no comment and a consumed event.
  # Four labels applied in 134 seconds on 2026-09-15 lost two runs that way. The
  # same state arises from a label applied before this workflow existed (three
  # issues, 2026-09-12). The sweep reconciles both: it finds the oldest eligible
  # issue and dispatches it. The event path stays as the fast path.
  #
  # Minute chosen deliberately (#795): `*/15` lands on :00/:15/:30/:45, which
  # GitHub's own docs name as the contended minutes under `schedule` — high
  # load can delay or drop queued runs entirely. After this workflow merged
  # (#790, 12:20 UTC) the first schedule-event run arrived at 17:13 — 4h54m and
  # 19 missed windows later — while `workflow_dispatch` on the same workflow
  # fired immediately. So the timer works; its worst case on the quarter-hours
  # is hours, not 15 minutes. `7,22,37,52` keeps the cadence off every one.
  schedule:
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:
    inputs:
      issue:
        description: "Issue number to dispatch. Leave empty to sweep for the oldest eligible."
        required: false
        type: string

# One group PER ISSUE, not one for the repository (#808). The single `agent-run` group
# was chosen in #753 because every PR appended a row to one DECISION-LOG.md and
# concurrent appends always conflict. ADR-0010 made the decision log one file per
# decision, so that collision no longer exists and the reason to serialise went with
# it. Per-issue groups mean N issues run at once and there is no shared one-deep
# pending slot — the mechanism that cancelled every third label (#788).
#
# Sweeps (schedule / workflow_dispatch with no input) share a `sweep` group so two
# sweeps never race each other over the same pick; the issue they pick is then claimed
# under guard 3 like any other.
#
# The spend bound is no longer "one at a time": it is MAX_RUNS_PER_DAY for the day and
# the max-concurrent check in the pick step for the moment.
concurrency:
  group: agent-run-${{ github.event.issue.number || github.event.inputs.issue || 'sweep' }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  MAX_RUNS_PER_DAY: 10
  MAX_CONCURRENT: 3

jobs:
  dispatch:
    name: Work the issue
    # Labeled events keep all four guards here. Sweep triggers pass through and
    # apply the same guards inside the pick step, where they can read the
    # timeline instead of the event payload.
    if: >-
      github.event_name != 'issues' ||
      (
        github.event.label.name == 'agent-ready' &&
        github.event.sender.type == 'User' &&
        !contains(github.event.issue.labels.*.name, 'agent-working') &&
        !contains(github.event.issue.labels.*.name, 'agent-done')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      # Resolve which issue this run is for. Three sources, one output, and every
      # later step reads `steps.pick.outputs.issue` — never the event payload,
      # which is empty on schedule and workflow_dispatch.
      - name: Pick the issue
        id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          EVENT_ISSUE: ${{ github.event.issue.number }}
          INPUT_ISSUE: ${{ github.event.inputs.issue }}
        run: |
          set -euo pipefail

          # Bound the moment (#808). MAX_RUNS_PER_DAY bounds the day; this bounds how many
          # agents run at once now that groups are per issue. Other in-progress runs of
          # this workflow are counted (this run is excluded). A labelled issue that bounces
          # here keeps `agent-ready` and gets no claim, so the sweep picks it up later —
          # deferred, never dropped.
          ACTIVE=$(gh api "repos/$REPO/actions/workflows/agent-dispatch.yml/runs?status=in_progress&per_page=50" \
            --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }})] | length")
          if [ "$ACTIVE" -ge "$MAX_CONCURRENT" ]; then
            echo "issue=" >> "$GITHUB_OUTPUT"
            echo "::notice::$ACTIVE dispatcher run(s) already in progress (max $MAX_CONCURRENT); deferring. The sweep will pick this up."
            exit 0
          fi

          if [ "$EVENT" = "issues" ]; then
            echo "issue=$EVENT_ISSUE" >> "$GITHUB_OUTPUT"
            echo "Labeled event for #$EVENT_ISSUE."
            exit 0
          fi

          # Eligible: open, carries agent-ready, carries no state label, agent-ready
          # applied by a User (guard 2 — read from the timeline, the same way
          # gated-paths.yml checks human-approved), and no PR in ANY state on
          # feature/issue-N-*. That last one is what keeps the sweep off work that
          # is mid-flight: after a good run the claim is released while the PR is
          # still open or merged-but-not-deployed, and the issue looks unclaimed.
          eligible() {
            local n="$1" labels applier prs
            labels=$(gh issue view "$n" --repo "$REPO" --json labels --jq '[.labels[].name]|join(",")')
            case ",$labels," in
              *,agent-ready,*) ;;
              *) echo "  #$n: no agent-ready"; return 1 ;;
            esac
            case ",$labels," in
              *,agent-working,*|*,agent-done,*|*,agent-stuck,*|*,agent-failed,*|*,agent-no-change,*)
                echo "  #$n: state label present"; return 1 ;;
            esac
            applier=$(gh api "repos/$REPO/issues/$n/timeline" --paginate \
              --jq '[.[] | select(.event=="labeled" and .label.name=="agent-ready")] | last
                    | if . == null then "" else "\(.actor.login) \(.actor.type)" end')
            case "$applier" in
              "")    echo "  #$n: no agent-ready label event found"; return 1 ;;
              *Bot)  echo "  #$n: agent-ready applied by a bot ($applier) — guard 2"; return 1 ;;
            esac
            prs=$(gh pr list --repo "$REPO" --state all --limit 100 --json headRefName \
              --jq "[.[] | select(.headRefName|startswith(\"feature/issue-$n-\"))] | length")
            if [ "$prs" != "0" ]; then
              echo "  #$n: $prs PR(s) already exist on its branch"; return 1
            fi
            return 0
          }

          if [ -n "$INPUT_ISSUE" ]; then
            if eligible "$INPUT_ISSUE"; then
              echo "issue=$INPUT_ISSUE" >> "$GITHUB_OUTPUT"
              echo "workflow_dispatch for #$INPUT_ISSUE — eligible."
            else
              echo "issue=" >> "$GITHUB_OUTPUT"
              echo "::warning::#$INPUT_ISSUE is not eligible; nothing dispatched."
            fi
            exit 0
          fi

          # Oldest first = lowest number. Simpler than reading every timeline for
          # the label timestamp, and only matters when several are waiting — in
          # which case they all get picked within the hour.
          echo "Sweeping for the oldest eligible agent-ready issue:"
          for n in $(gh issue list --repo "$REPO" --label agent-ready --state open \
                       --limit 100 --json number --jq '.[].number' | sort -n); do
            if eligible "$n"; then
              echo "issue=$n" >> "$GITHUB_OUTPUT"
              echo "Picked #$n."
              exit 0
            fi
          done
          echo "issue=" >> "$GITHUB_OUTPUT"
          echo "Nothing eligible; sweep is a no-op."

      - name: Check the daily ceiling
        if: steps.pick.outputs.issue != ''
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          ISSUE: ${{ steps.pick.outputs.issue }}
        run: |
          set -euo pipefail
          TODAY=$(date -u +%Y-%m-%d)

          # Count runs in which the AGENT actually ran — i.e. a `Work the issue` step that
          # was not skipped — not workflow invocations. Two earlier versions got this
          # wrong in two directions: `total_count` counted every `issues: labeled` event
          # (13/10 on 2026-09-14 with one real run), and the conclusion filter that
          # replaced it counted every *sweep* that picked nothing, because a no-op sweep
          # ends `success` (refused #507 on 2026-09-17 after ~7 real runs). The only
          # honest signal is the step itself, so read each of today's runs' jobs. That
          # is one API call per run, bounded by the ceiling this step enforces.
          COUNT=0
          for id in $(gh api --paginate \
              "repos/$REPO/actions/workflows/agent-dispatch.yml/runs?created=>=$TODAY&per_page=100" \
              --jq '.workflow_runs[] | select(.conclusion != "skipped" and .conclusion != "cancelled") | .id'); do
            if [ "$id" = "${{ github.run_id }}" ]; then
              COUNT=$((COUNT + 1))   # this run, which is about to reach the agent
              continue
            fi
            w=$(gh api "repos/$REPO/actions/runs/$id/jobs" \
                  --jq '[.jobs[].steps[] | select(.name == "Work the issue")][0].conclusion // "absent"')
            case "$w" in
              skipped|absent) ;;      # ceiling refusal, no-op sweep, or bounced on MAX_CONCURRENT
              *) COUNT=$((COUNT + 1)) ;;
            esac
          done

          echo "Dispatch runs today that reached the agent (including this one): $COUNT / $MAX_RUNS_PER_DAY"
          if [ "$COUNT" -gt "$MAX_RUNS_PER_DAY" ]; then
            # --repo is required: this step runs before checkout, so `gh` has no git
            # remote to infer from. Without it the refusal failed with "not a git
            # repository", the comment never posted, and the developer saw a label
            # that silently did nothing.
            gh issue comment "$ISSUE" --repo "$REPO" --body "Dispatch refused: $COUNT runs reached the agent today, ceiling is $MAX_RUNS_PER_DAY. Re-apply \`agent-ready\` tomorrow, or raise \`MAX_RUNS_PER_DAY\` in \`.github/workflows/agent-dispatch.yml\` if the ceiling is wrong."
            exit 1
          fi

      # Claim before working, so guard 3 means something for the next event and a
      # human can see the issue is taken.
      - name: Claim the issue
        if: steps.pick.outputs.issue != ''
        id: claim
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ steps.pick.outputs.issue }}
          REPO: ${{ github.repository }}
        run: gh issue edit "$ISSUE" --repo "$REPO" --add-label agent-working

      - name: Checkout
        if: steps.pick.outputs.issue != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # The PAT, not GITHUB_TOKEN. A PR opened with GITHUB_TOKEN does not trigger
          # `pull_request` workflows, so `Gated Path Review` and `PR Contract` would
          # never run on agent PRs — the gate silently absent on exactly the PRs it
          # exists for. Same class as the #752 finding, and worse, because here it
          # would be permanent rather than conflict-dependent.
          token: ${{ secrets.RELEASE_PAT }}

      - name: Work the issue
        if: steps.pick.outputs.issue != ''
        uses: anthropics/claude-code-action@56cf60fde42f7b19c3abfd5c9c48b69a1288461f # v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.RELEASE_PAT }}
          branch_prefix: feature/
          # The action supplies the base GitHub tools and nothing else; every other
          # tool must be named here (its docs/configuration.md, "base GitHub tools are
          # always included"). Without this the agent is told to branch, commit and
          # open a PR while the harness denies every call that would do it — 12 denials
          # over 20 turns on the first real run, no output, job green (#765).
          #
          # `Bash` is unenumerated, deliberately (#782). The previous list named
          # git/gh/npm/npx, which blocked `cat`, `docker`, `curl` and `node` while
          # permitting `npm run <script>` and `npm install` postinstall hooks — i.e. it
          # already granted arbitrary code execution. It was never a containment
          # boundary; it was a list that stopped the agent checking its own work. #686
          # shipped a graceful-shutdown fix whose SIGTERM path it could not exercise and
          # four compose healthchecks it could not validate, and said so in #781.
          #
          # Do not re-add the enumeration believing it contains anything. What actually
          # bounds this run: an ephemeral runner, RELEASE_PAT's scope (which cannot even
          # write to issues, #771), Gated Path Review, the required PR Contract and Gate
          # checks, MAX_RUNS_PER_DAY and the 45-minute timeout.
          #
          # WebFetch and WebSearch stay off the list. They are not needed to verify a
          # change and widen egress rather than verification; add them only when
          # something concrete needs them.
          #
          # 200 turns, not 80. That number was guessed before any run had reached the
          # agent, and every run since overran it: #731 used 82, #684 used 81 and ended
          # `is_error: true` truncated mid-wrap-up, #686 used 121. A cap that truncates
          # real work is not a bound, it is a defect. The bound is `timeout-minutes: 45`
          # above plus MAX_RUNS_PER_DAY, both of which cap spend directly; those runs
          # took 16, 8 and 19 minutes, so turns bound long before time does (#772).
          claude_args: --max-turns 200 --allowedTools "Edit,Write,Read,Glob,Grep,Bash"
          prompt: |
            Work GitHub issue #${{ steps.pick.outputs.issue }} in this repository,
            autonomously, to completion.

            Read `CLAUDE.md` first, then `specs/AGENT-AUTONOMY-POLICY.md` and
            `specs/workflows/AGENT-PIPELINE.md`. They are the contract for this run;
            everything below is a summary of them, and they win wherever this prompt
            is thinner.

            This issue carries `agent-ready`, so it is **Tier B**: do not post a plan
            and do not wait for approval. Nobody is watching this run. There is no one
            to answer a question, so do not ask one.

            - Branch `feature/issue-${{ steps.pick.outputs.issue }}-<slug>` off `main`.
              Never commit to `main`.
            - Where the policy is silent, take the most reversible option, ship it, and
              record it as **one new file** under `specs/decisions/log/` in the same PR
              (`YYYY-MM-DD-<slug>.md`, frontmatter per `log/README.md`). Never append to
              `specs/decisions/DECISION-LOG.md` — it is frozen. Write any new standing
              rule back into the policy file.
            - Documentation is part of the change, not a follow-up.
            - **You cannot write to the issue. Do not try.** Your credential 403s on
              every issue label, comment and close. Labels you apply to the **PR** are
              mirrored onto the issue by this workflow after you finish, and the claim
              is released for you on every path. Anything you want a human to read goes
              in a PR comment.
            - Open the PR and label it `agent-review` (this is what permits auto-merge).
              The PR body must satisfy the PR contract: the issue reference, a
              `## Verification` section saying what CI does **and does not** cover, and
              a deviation statement.
            - Before calling CI green, confirm the required checks are **present**, not
              merely that nothing is red. A conflicted PR runs no `pull_request`
              workflows at all.
            - If the change touches the gated list, finish everything that does not
              depend on it, let `Gated Path Review` fail, post one batched comment with
              the options and your recommendation, and label the **PR** `agent-stuck`.
              That is the escalation — do not add a second one.
            - If CI is red three cycles running on the same PR, stop and label the
              **PR** `agent-failed`. Never force-push, never delete a branch.

            - If after investigating the issue needs **no change** — already fixed,
              duplicate, or based on a mistaken premise — do not open a PR. Write your
              reasoning to `$GITHUB_WORKSPACE/.agent-outcome` and stop:

                  no-change-needed
                  <one paragraph on what you found and why nothing should change>

              This is a real outcome, not a failure. **Do not invent work to avoid it.**
              Without that file a run with no PR is recorded as failed, so write it
              before you finish.

            Post what you did as a PR comment when the PR is open.

      # Keep the transcript, every run (#789). #730 ended `is_error: true` after 79
      # turns with no branch, no PR and no comment, and the action discards its
      # execution log with the runner — so the `agent-failed` comment's "re-apply once
      # the cause is understood" pointed at nothing. This is the action's own record
      # (prompt, every tool call, file contents read, reasoning), uploaded whether the
      # run succeeded or not: a successful run's transcript is how a human checks *why*
      # the agent scoped something as it did without re-deriving it from the diff.
      #
      # Exposure, decided rather than defaulted: the repo is public, so the artifact is
      # downloadable by anyone with read access. Repository contents are already public.
      # Secrets are environment, not files, and the transcript is not run through the
      # job-log masker — the first artifact was grepped for both token prefixes before
      # this was declared safe (result recorded on #789). 30-day retention, not 90.
      #
      # `if-no-files-found: ignore` because a sweep that picks nothing skips
      # `Work the issue` and writes no transcript; that is not a failure.
      # REDACT BEFORE UPLOAD. The first transcript ever kept (#800's run, 2026-09-17)
      # contained RELEASE_PAT in clear, four times: the agent ran `git remote -v` and
      # the action had embedded the token in the remote URL as
      # `x-access-token:github_pat_…@`. The job log masks secrets; the transcript is
      # the action's raw record and is not masked. The artifact was deleted within
      # the hour and the token rotated. This step masks the remote-URL credential
      # form and every known token prefix in place, and refuses to continue if any
      # survives — an upload that might leak is worse than no upload (#789).
      - name: Redact secrets from the transcript
        if: always() && steps.claim.outcome == 'success'
        env:
          TRANSCRIPT: ${{ runner.temp }}/claude-execution-output.json
        run: |
          set -euo pipefail
          [ -f "$TRANSCRIPT" ] || { echo "No transcript written; nothing to redact."; exit 0; }
          sed -i -E \
            -e 's#(x-access-token:)[^@"[:space:]]+@#\1***@#g' \
            -e 's#github_pat_[A-Za-z0-9_]+#github_pat_***#g' \
            -e 's#ghp_[A-Za-z0-9]+#ghp_***#g' \
            -e 's#gh[opsur]_[A-Za-z0-9]{20,}#gh?_***#g' \
            -e 's#sk-ant-[A-Za-z0-9_-]+#sk-ant-***#g' \
            "$TRANSCRIPT"
          if grep -qE 'x-access-token:[^*@"[:space:]]|github_pat_[A-Za-z0-9_]{8}|ghp_[A-Za-z0-9]{8}|sk-ant-[A-Za-z0-9_-]{8}' "$TRANSCRIPT"; then
            echo "::error::Token material survived redaction; refusing to upload."
            rm -f "$TRANSCRIPT"
            exit 1
          fi
          echo "Transcript redacted; no token material remains."

      - name: Keep the run transcript
        id: transcript
        if: always() && steps.claim.outcome == 'success'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: agent-run-${{ steps.pick.outputs.issue }}-${{ github.run_id }}
          path: ${{ runner.temp }}/claude-execution-output.json
          retention-days: 30
          if-no-files-found: ignore

      # A run that produces nothing must not report success, and must not strand the
      # issue behind its own claim.
      #
      # The first real dispatch (#688, run 34844602177) exited 0 after 20 turns and 12
      # permission denials, having produced no branch, no PR and no comment — and left
      # `agent-working` behind, so guard 3 refused every retry until a human cleared the
      # label by hand. `Work the issue` was the last meaningful step; nothing asserted a
      # work product existed.
      #
      # The pre-#753 VPS runner had this check — the failure comments on #691 and #692
      # read "no commits were produced". It did not survive the move to Actions. This
      # restores it.
      #
      # `always()` so it also fires when the Claude step fails: releasing the claim
      # matters more on the failure path than the success one.
      #
      # KNOWN LIMIT: an agent that correctly concludes no change is needed is
      # indistinguishable here from one that was denied every tool, and both are labelled
      # `agent-failed`. Fixing that needs a signal from the agent rather than an inference
      # from a missing PR (#765).
      # `always()` alone fired this after the ceiling refused a dispatch: it tried to
      # release a claim that was never made and mark an untouched issue `agent-failed`.
      # Gate on the claim having actually succeeded.
      #
      # GITHUB_TOKEN, not RELEASE_PAT. The PAT cannot write labels — the first run of
      # this step failed with "Resource not accessible by personal access token
      # (addLabelsToLabelable)" — so the whole failure path was inert. The job already
      # declares `issues: write`, and the claim step uses this token successfully.
      - name: Confirm the run produced work
        if: always() && steps.claim.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE: ${{ steps.pick.outputs.issue }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          TRANSCRIPT_URL: ${{ steps.transcript.outputs.artifact-url }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          set -euo pipefail

          # #800: `agent-stuck` and `agent-no-change` both need a human decision and
          # were both silent — reusing ci-failure-notify.yml's Telegram path (#631)
          # rather than a second notification mechanism. Once per state, not
          # repeatedly: this step only runs once per dispatch, and a mirrored state
          # label removes the issue from the sweep's eligible set (`pick` step above),
          # so there is no second run to post a second message. Best-effort — `|| true`
          # so a Telegram outage cannot fail the step that releases the claim.
          notify_telegram() {
            local text="$1"
            [ -n "$TELEGRAM_BOT_TOKEN" ] || return 0
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d chat_id="${TELEGRAM_CHAT_ID}" \
              -d parse_mode="HTML" \
              -d disable_web_page_preview="true" \
              -d text="$text" > /dev/null || true
          }

          # Head branch only, deliberately. Matching the PR *body* for "#<issue>" looks
          # more forgiving and is wrong: #762's body discusses the failed #688 run at
          # length, so a body match reports that #688 produced work when it produced
          # nothing. Tested against the live PR list before shipping — body matching
          # returned 1 for #688, branch matching returns 0.
          #
          # The branch name is the contract: the prompt mandates
          # feature/issue-<n>-<slug> and branch_prefix pins the prefix. A misnamed
          # branch therefore reads as failure — a loud false negative, which is the
          # safe direction when the alternative is a silent false positive.
          # The agent cannot write to issues at all — RELEASE_PAT 403s on every
          # issue-side call, GraphQL and REST (#771). It *can* label PRs; it applied
          # `agent-review` to #769 unaided. So the agent signals on the PR and this
          # step mirrors that onto the issue using GITHUB_TOKEN, which the claim step
          # already proves can write issue labels.
          #
          # Head branch only, deliberately. Matching the PR *body* for "#<issue>" looks
          # more forgiving and is wrong: #762's body discusses the failed #688 run at
          # length, so a body match reports that #688 produced work when it produced
          # nothing. Tested against the live PR list before shipping — body matching
          # returned 1 for #688, branch matching returns 0.
          PR=$(gh pr list --repo "$REPO" --state all --limit 100 \
            --json number,headRefName,labels \
            | jq -c --arg n "$ISSUE" '[.[] | select(
                .headRefName | startswith("feature/issue-" + $n + "-")
              )] | first // empty')

          # No PR. Two very different reasons, and #779 exists because they used to be
          # one: a run that was denied every tool, and a run that correctly concluded the
          # issue needs no change. The agent distinguishes them by writing a marker into
          # the workspace — same job, same runner, so no credential is involved and there
          # is nothing that can 403 the way every issue-side write does (#771).
          #
          # Absence is the safe default. A denied, crashed or truncated run writes nothing
          # and takes the `agent-failed` path exactly as before; the new outcome requires a
          # positive act by the agent.
          if [ -z "$PR" ]; then
            OUTCOME_FILE="$GITHUB_WORKSPACE/.agent-outcome"
            OUTCOME=""
            if [ -f "$OUTCOME_FILE" ]; then
              # Bounded read, exact first-line match. A malformed or partially written
              # file must fall through to agent-failed rather than be read generously —
              # this branch decides whether a human is paged, so it errs terminal.
              OUTCOME=$(head -c 4096 "$OUTCOME_FILE" | head -n 1 | tr -d '\r' | xargs || true)
            fi

            if [ "$OUTCOME" = "no-change-needed" ]; then
              REASON=$(head -c 4096 "$OUTCOME_FILE" | tail -n +2)
              [ -n "$REASON" ] || REASON="_The agent gave no reason, which is itself worth a look._"

              gh issue edit "$ISSUE" --repo "$REPO" \
                --remove-label agent-working --add-label agent-no-change

              gh issue comment "$ISSUE" --repo "$REPO" --body "### Agent found no change was needed

          $REASON

          ---

          No PR was opened, and this is **not** a failed run. The agent does not close issues — whether this one was valid is your call. Close it, or remove \`agent-no-change\` and re-apply \`agent-ready\` if you disagree with the reasoning.

          Run: $RUN_URL"

              notify_telegram "@racu8_bot
          🤷 <b>agent-no-change on #${ISSUE}</b>
          $(printf '%s' "$REASON" | head -n 1)
          <a href=\"${RUN_URL}\">View run</a>"

              echo "Issue #$ISSUE needs no change per the agent; claim released, agent-no-change applied."
              exit 0
            fi

            gh issue edit "$ISSUE" --repo "$REPO" \
              --remove-label agent-working --add-label agent-failed
            # Mutually exclusive states (#800): a stale `agent-stuck` from an earlier
            # run on this issue must not survive alongside a fresh `agent-failed`.
            gh issue edit "$ISSUE" --repo "$REPO" --remove-label agent-stuck || true

            gh issue comment "$ISSUE" --repo "$REPO" --body "Agent run produced no PR and no branch.

          The \`agent-working\` claim has been released and \`agent-failed\` applied, so this issue will **not** retry automatically. Remove \`agent-failed\` and re-apply \`agent-ready\` once the cause is understood.

          Run: $RUN_URL
          Transcript (30-day artifact, the full execution log from the action): ${TRANSCRIPT_URL:-not captured; see the Artifacts section of the run}

          If the agent concluded that no change was needed, that is currently indistinguishable from a failed run — see #765."

            echo "::error::Run produced no PR for issue #$ISSUE. Claim released, agent-failed applied."
            exit 1
          fi

          PR_NUM=$(printf '%s' "$PR" | jq -r '.number')

          # `agent-failed` wins over `agent-stuck` if somehow both are present: failed is
          # terminal and stuck is not, and over-escalating is the safe direction.
          SIGNAL=$(printf '%s' "$PR" | jq -r '
            [.labels[].name]
            | if index("agent-failed") then "agent-failed"
              elif index("agent-stuck") then "agent-stuck"
              else "" end')

          # The claim is released on every path through this step. There is no route
          # that leaves an issue stranded behind its own `agent-working` — that is the
          # whole point of moving the lifecycle here (#771).
          gh issue edit "$ISSUE" --repo "$REPO" --remove-label agent-working

          if [ -n "$SIGNAL" ]; then
            gh issue edit "$ISSUE" --repo "$REPO" --add-label "$SIGNAL"

            # Mutually exclusive states (#800): whichever one is being written now,
            # clear the other rather than leaving a stale copy from a previous run on
            # the same issue — #730 carried both at once and neither label lifecycle
            # step had ever cleared the opposite one.
            if [ "$SIGNAL" = "agent-stuck" ]; then
              gh issue edit "$ISSUE" --repo "$REPO" --remove-label agent-failed || true

              # First line of the agent's escalation comment — the last comment it
              # left on the PR before labelling it `agent-stuck` (AGENT-PIPELINE.md
              # §3: "one batched comment with the options and recommendation").
              DETAIL=$(gh pr view "$PR_NUM" --repo "$REPO" --json comments \
                --jq '.comments[-1].body // "(no PR comment found)"' | head -n 1)
              notify_telegram "@racu8_bot
          🧑‍💻 <b>agent-stuck on #${ISSUE}</b> (PR #${PR_NUM})
          ${DETAIL}
          <a href=\"${RUN_URL}\">View run</a>"
            else
              gh issue edit "$ISSUE" --repo "$REPO" --remove-label agent-stuck || true
            fi

            echo "PR #$PR_NUM signalled $SIGNAL; mirrored onto issue #$ISSUE, claim released."
            exit 0
          fi

          # PR exists and signals nothing wrong. `agent-done` is deliberately not applied
          # here: it should mean the build is live, which only the staging deploy knows.
          # ci.yml applies it after the smoke tests pass.
          echo "PR #$PR_NUM found for issue #$ISSUE; claim released, outcome left to auto-merge and staging."
