name: CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, redesign/v3]
  merge_group:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: Lint, Type Check, Test & Build
    runs-on: ubuntu-latest

    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      SESSION_SECRET: ci-secret-not-for-production

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 25
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run check
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"

      - name: Run tests
        run: npm test

      - name: Check migration drift
        run: |
          # Count migration files before and after running generate
          BEFORE=$(find migrations -name '*.sql' 2>/dev/null | wc -l)
          npx drizzle-kit generate
          AFTER=$(find migrations -name '*.sql' 2>/dev/null | wc -l)
          if [ "$AFTER" -gt "$BEFORE" ]; then
            echo "::error::Schema has changed but no migration was committed. Run 'npx drizzle-kit generate' locally and commit the result."
            git diff --stat
            exit 1
          fi
          echo "No migration drift detected"

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

  changes:
    name: Detect Code Changes
    needs: ci
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      code: ${{ steps.filter.outputs.code }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Check for code changes
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            code:
              - '!(specs/**|docs/**|**/*.md|.github/ISSUE_TEMPLATE/**)'

  # Build + Trivy scan run on BOTH pull_request and push.
  # Image is pushed to GHCR only on push to main / redesign/v3 (PRs build
  # locally and scan without pushing). This closes the gap where auto-merge
  # was firing before Trivy ran. See #631.
  build-and-scan:
    name: Build & Trivy Container Scan
    needs: [ci, changes]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Build image (load locally; push only on main/redesign)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          load: true
          push: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/redesign/v3') }}
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:${{ github.sha }}
            ${{ steps.image.outputs.name }}:${{ github.run_number }}
          build-args: |
            APP_VERSION=${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.30.0
        with:
          image-ref: ${{ steps.image.outputs.name }}:${{ github.sha }}
          format: json
          output: trivy-report.json
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          # exit-code stays 0 on purpose. The pass/fail decision moved to the
          # partitioner below, which fails only on findings in paths we control.
          # See #728: a single all-or-nothing gate meant every upstream CVE in
          # vendored content turned main red with no fix available to us.
          exit-code: "0"
          trivyignores: .trivyignore.yaml

      - name: Partition findings (block on ours, warn on vendored)
        run: node script/partition-trivy.mjs trivy-report.json

  deploy-staging:
    name: Deploy to Staging
    needs: build-and-scan
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      # Needed to post deploy evidence back to the issue (#744).
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sync docker-compose to VPS
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: staging
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: deploy/staging/docker-compose.yml
          target: ~/app/
          strip_components: 2

      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: staging
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: DEPLOY_SHA
          script: |
            cd ~/app
            docker pull ghcr.io/ilv78/art-world-hub:$DEPLOY_SHA
            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$DEPLOY_SHA/" .env || echo "IMAGE_TAG=$DEPLOY_SHA" >> .env
            # Ensure upload subdirs exist on the Docker volume (new subdirs may be missing)
            docker compose run --rm --no-deps --user root --entrypoint sh app -c "mkdir -p /app/uploads/artworks /app/uploads/blog-covers /app/uploads/avatars /app/uploads/og-cards /app/logs && chown -R appuser:appgroup /app/uploads /app/logs"
            docker compose up -d --remove-orphans
            # Run pending database migrations
            echo "Running database migrations..."
            docker compose exec -T app npx drizzle-kit migrate || echo "Warning: migration failed or no pending migrations"
            echo "Waiting for app to be healthy..."
            for i in $(seq 1 60); do
              if docker compose exec -T app node -e "fetch('http://localhost:5000/health').then(r => { if (!r.ok) process.exit(1) })" 2>/dev/null; then
                echo "Staging is healthy after ${i}s"
                exit 0
              fi
              sleep 2
            done
            echo "Health check failed"
            docker compose logs --tail=50 app
            exit 1

      - name: Smoke test — health check
        run: |
          echo "Waiting for container to boot..."
          sleep 15
          HEALTH_URL="${{ secrets.STAGING_URL }}/health"
          HTTP_STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" "$HEALTH_URL")
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Health check failed — HTTP $HTTP_STATUS"
            exit 1
          fi
          echo "Health check passed — staging deployment verified"

      - name: Smoke test — version and changelog
        run: |
          BASE_URL="${{ secrets.STAGING_URL }}"

          VERSION=$(curl --silent --fail "$BASE_URL/api/version" | grep -o '"version":"[^"]*"' | cut -d'"' -f4)
          if [ -z "$VERSION" ] || [ "$VERSION" = "unknown" ]; then
            echo "WARNING: /api/version returned '${VERSION:-empty}' — CHANGELOG.md may be missing from the image"
          else
            echo "Version check passed — $VERSION"
          fi

          CHANGELOG=$(curl --silent --fail "$BASE_URL/api/changelog" | head -30)
          if ! echo "$CHANGELOG" | grep -qE '## \[[0-9]+\.[0-9]+\.[0-9]+\]'; then
            echo "WARNING: /api/changelog has no version entries"
          else
            LATEST=$(echo "$CHANGELOG" | grep -oE '## \[[0-9]+\.[0-9]+\.[0-9]+\]' | head -1)
            echo "Changelog check passed — latest entry: $LATEST"
          fi

      - name: Smoke test — logging infrastructure
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: staging
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ~/app
            # Since #738 the active file is `app.<n>.log` — pino-roll inserts the
            # number before the extension. `app.log` survives only on volumes that
            # predate that change, so asserting on it passed while reading the
            # PREVIOUS build's log, and would fail outright on a fresh volume.
            # Resolve the newest file the same way `logReadPaths()` does: highest
            # numeric suffix, falling back to the legacy name.
            LOG_FILE=$(docker compose exec -T app sh -c \
              'ls -1 /app/logs/app.*.log 2>/dev/null | sort -t. -k2 -n | tail -1' | tr -d "\r")
            if [ -z "$LOG_FILE" ]; then
              LOG_FILE=/app/logs/app.log
            fi
            echo "Active log file: $LOG_FILE"
            echo "Checking log file exists..."
            docker compose exec -T app test -f "$LOG_FILE" || { echo "FAIL: $LOG_FILE not found"; exit 1; }
            echo "Checking log file has entries..."
            LOG_LINES=$(docker compose exec -T app wc -l < "$LOG_FILE")
            if [ "$LOG_LINES" -lt 1 ]; then
              echo "FAIL: log file is empty"
              exit 1
            fi
            echo "Checking logs are valid JSON..."
            docker compose exec -T app tail -1 "$LOG_FILE" | python3 -c "import sys,json; json.load(sys.stdin)" || { echo "FAIL: last log line is not valid JSON"; exit 1; }
            echo "Checking startup log entries..."
            docker compose exec -T app grep -c '"msg":"Server listening"' "$LOG_FILE" > /dev/null || { echo "FAIL: no Server listening entry"; exit 1; }
            # The audit trail (#738) must actually be wired: /mcp requests reach
            # pino-http only because autoLogging was widened to cover them.
            echo "Checking the MCP audit trail is wired..."
            docker compose exec -T app grep -q '"module":"mcp"' "$LOG_FILE" || { echo "FAIL: no mcp module entries"; exit 1; }
            echo "Logging smoke test passed — $LOG_LINES entries in $LOG_FILE, valid JSON"

      # Post-deploy evidence (#744). An autonomous pipeline merges its own work,
      # so the record that a change actually ran has to be written somewhere the
      # developer reads — the issue — rather than left in a job log nobody opens.
      # Closes the gap the #732 review hit: CI said "deployed", and answering
      # "did it work?" still meant SSH-ing to a box.
      - name: Post deploy evidence to the issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail

          # Squash merges carry "(#123)" for the PR and usually "(#456)" for the
          # issue; both are worth commenting on, and GitHub silently ignores a
          # comment on a closed issue.
          issues=$(printf '%s' "$COMMIT_MESSAGE" | grep -oE '#[0-9]+' | tr -d '#' | sort -u)
          if [ -z "$issues" ]; then
            echo "No issue or PR referenced in the commit message; nothing to post."
            exit 0
          fi

          version=$(curl --silent --fail "${{ secrets.STAGING_URL }}/api/version" || echo '{}')

          body=$(cat <<EOF
          ### ✅ Deployed to staging

          | | |
          |---|---|
          | Commit | \`${{ github.sha }}\` |
          | Run | [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) |
          | Version reported by staging | \`$(printf '%s' "$version" | head -c 200)\` |

          Smoke tests passed: health endpoint, version and changelog, and the logging
          infrastructure (active rotated log file present, valid NDJSON, startup entry,
          MCP audit entries).

          This confirms the build is **live on staging** — not that this change's own
          behaviour was exercised. Issue-specific verification belongs in a comment of
          its own.
          EOF
          )

          for issue in $issues; do
            echo "Commenting on #$issue"
            gh issue comment "$issue" --body "$body" || echo "Could not comment on #$issue (may be a PR or inaccessible); continuing."
          done

      - name: Tag release in git
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "release-${{ github.run_number }}" "${{ github.sha }}"
          git push origin "release-${{ github.run_number }}"

      - name: Notify Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEPLOY_STATUS: ${{ job.status }}
          REPO_NAME: ${{ github.event.repository.name }}
          DEPLOY_SHA: ${{ github.sha }}
          TRIGGERED_BY: ${{ github.actor }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then exit 0; fi
          if [ "$DEPLOY_STATUS" = "success" ]; then EMOJI="✅"; else EMOJI="❌"; fi
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="HTML" \
            -d text="@racu8_bot
          ${EMOJI} <b>Staging deployment: ${DEPLOY_STATUS}</b> [${REPO_NAME}]
          Staging address: https://staging.vernis9.art
          Tag: <code>${DEPLOY_SHA}</code>
          Release: <code>release-${RUN_NUMBER}</code>
          By: ${TRIGGERED_BY}"

  deploy-preview:
    name: Deploy to Preview
    needs: build-and-scan
    if: github.ref == 'refs/heads/redesign/v3' && github.event_name == 'push'
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sync docker-compose to VPS
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: preview
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: deploy/preview/docker-compose.yml
          target: ~/app/
          strip_components: 2

      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: preview
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: DEPLOY_SHA
          script: |
            cd ~/app
            docker pull ghcr.io/ilv78/art-world-hub:$DEPLOY_SHA
            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$DEPLOY_SHA/" .env || echo "IMAGE_TAG=$DEPLOY_SHA" >> .env
            # Ensure upload subdirs exist on the Docker volume (new subdirs may be missing)
            docker compose run --rm --no-deps --user root --entrypoint sh app -c "mkdir -p /app/uploads/artworks /app/uploads/blog-covers /app/uploads/avatars /app/uploads/og-cards /app/logs && chown -R appuser:appgroup /app/uploads /app/logs"
            docker compose up -d --remove-orphans
            # Run pending database migrations (push mode, like staging)
            echo "Running database schema push..."
            docker compose exec -T app npx drizzle-kit push --force || echo "Warning: schema push failed"
            echo "Waiting for app to be healthy..."
            for i in $(seq 1 60); do
              if docker compose exec -T app node -e "fetch('http://localhost:5000/health').then(r => { if (!r.ok) process.exit(1) })" 2>/dev/null; then
                echo "Preview is healthy after ${i}s"
                exit 0
              fi
              sleep 2
            done
            echo "Health check failed"
            docker compose logs --tail=50 app
            exit 1

      - name: Smoke test — health check
        env:
          PREVIEW_URL: ${{ secrets.PREVIEW_URL }}
        run: |
          if [ -z "$PREVIEW_URL" ]; then
            echo "PREVIEW_URL secret not set, skipping external smoke test"
            exit 0
          fi
          echo "Waiting for container to boot..."
          sleep 15
          HEALTH_URL="${PREVIEW_URL}/health"
          HTTP_STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" "$HEALTH_URL")
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Health check failed — HTTP $HTTP_STATUS"
            exit 1
          fi
          echo "Health check passed — preview deployment verified"

      - name: Notify Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEPLOY_STATUS: ${{ job.status }}
          REPO_NAME: ${{ github.event.repository.name }}
          DEPLOY_SHA: ${{ github.sha }}
          TRIGGERED_BY: ${{ github.actor }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then exit 0; fi
          if [ "$DEPLOY_STATUS" = "success" ]; then EMOJI="✅"; else EMOJI="❌"; fi
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="HTML" \
            -d text="@racu8_bot
          ${EMOJI} <b>Preview deployment: ${DEPLOY_STATUS}</b> [${REPO_NAME}]
          Preview address: https://preview.vernis9.art
          Branch: redesign/v3
          Tag: <code>${DEPLOY_SHA}</code>
          By: ${TRIGGERED_BY}"
