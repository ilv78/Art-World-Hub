name: Deploy to Production

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (commit SHA, run_number, or 'latest')"
        required: true
        default: "latest"

permissions:
  contents: read

jobs:
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sync docker-compose to VPS
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1.0.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: production
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: deploy/production/docker-compose.yml
          target: ~/app/
          strip_components: 2

      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        env:
          IMAGE_TAG: ${{ github.event.inputs.image_tag }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: production
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: IMAGE_TAG
          script: |
            cd ~/app
            # Save current IMAGE_TAG for rollback
            CURRENT_TAG=$(grep '^IMAGE_TAG=' .env | cut -d= -f2 || true)
            if [ -n "$CURRENT_TAG" ] && [ "$CURRENT_TAG" != "$IMAGE_TAG" ]; then
              echo "Saving current tag for rollback: $CURRENT_TAG"
              echo "$CURRENT_TAG" > .previous_image_tag
            fi
            docker pull ghcr.io/ilv78/art-world-hub:$IMAGE_TAG
            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$IMAGE_TAG/" .env || echo "IMAGE_TAG=$IMAGE_TAG" >> .env
            # --- Pre-migration safety dump (#682) ---
            # MUST run before `docker compose up -d`: the app applies migrations on
            # container start (docker-entrypoint.sh + DB_MIGRATION_MODE=migrate), so a
            # dump taken after that point is already post-migration and useless.
            echo "Taking pre-migration database dump..."
            docker compose up -d db
            DB_READY=""
            for i in $(seq 1 30); do
              if docker compose exec -T db pg_isready -U artverse -d artverse_production >/dev/null 2>&1; then
                DB_READY=1
                break
              fi
              sleep 1
            done
            if [ -z "$DB_READY" ]; then
              echo "ERROR: db not ready after 30s — aborting before migrations run"
              exit 1
            fi
            mkdir -p ~/backups/pre-deploy
            DUMP_FILE="$HOME/backups/pre-deploy/$(date -u +%Y%m%dT%H%M%SZ)-${IMAGE_TAG}.dump"
            docker compose exec -T db pg_dump -U artverse -Fc artverse_production > "$DUMP_FILE"
            # A dropped stream leaves a truncated file that only fails at restore time.
            if ! docker compose exec -T db pg_restore --list > /dev/null < "$DUMP_FILE"; then
              echo "ERROR: pre-migration dump is truncated or unreadable — aborting deploy"
              rm -f "$DUMP_FILE"
              exit 1
            fi
            echo "Pre-migration dump OK: $DUMP_FILE ($(du -h "$DUMP_FILE" | cut -f1))"
            # Keep the 10 most recent; the nightly pull to the dev VPS archives them off-box.
            ls -1t "$HOME"/backups/pre-deploy/*.dump 2>/dev/null | tail -n +11 | xargs -r rm -f
            # Ensure upload subdirs exist on the Docker volume (new subdirs may be missing)
            docker compose run --rm --no-deps --user root --entrypoint sh app -c "mkdir -p /app/uploads/artworks /app/uploads/blog-covers /app/uploads/avatars /app/uploads/og-cards /app/logs && chown -R appuser:appgroup /app/uploads /app/logs"
            docker compose up -d --remove-orphans
            # Run pending database migrations
            echo "Running database migrations..."
            docker compose exec -T app npx drizzle-kit migrate || echo "Warning: migration failed or no pending migrations"
            echo "Waiting for app to be healthy..."
            for i in $(seq 1 60); do
              if docker compose exec -T app node -e "fetch('http://localhost:5000/health').then(r => { if (!r.ok) process.exit(1) })" 2>/dev/null; then
                echo "Production is healthy after ${i}s"
                exit 0
              fi
              sleep 2
            done
            echo "Health check failed"
            docker compose logs --tail=50 app
            exit 1

      - name: Smoke test — health check
        run: |
          echo "Waiting for container to boot..."
          sleep 15
          HEALTH_URL="${{ secrets.PRODUCTION_URL }}/health"
          HTTP_STATUS=$(curl --silent --output /dev/null --write-out "%{http_code}" "$HEALTH_URL")
          if [ "$HTTP_STATUS" != "200" ]; then
            echo "Health check failed — HTTP $HTTP_STATUS"
            echo "Triggering rollback..."
            exit 1
          fi
          echo "Health check passed — production deployment verified"

      - name: Smoke test — version and changelog
        run: |
          BASE_URL="${{ secrets.PRODUCTION_URL }}"

          # Check /api/version returns a valid version (not "unknown")
          VERSION=$(curl --silent --fail "$BASE_URL/api/version" | grep -o '"version":"[^"]*"' | cut -d'"' -f4)
          if [ -z "$VERSION" ] || [ "$VERSION" = "unknown" ]; then
            echo "WARNING: /api/version returned '${VERSION:-empty}' — CHANGELOG.md may be missing from the image"
            echo "See postmortem: docs/postmortems/2026-03-29-changelog-version-mismatch.md"
          else
            echo "Version check passed — $VERSION"
          fi

          # Check /api/changelog returns content with at least one version entry
          CHANGELOG=$(curl --silent --fail "$BASE_URL/api/changelog" | head -30)
          if ! echo "$CHANGELOG" | grep -qE '## \[[0-9]+\.[0-9]+\.[0-9]+\]'; then
            echo "WARNING: /api/changelog has no version entries — CHANGELOG.md may be stale"
          else
            LATEST=$(echo "$CHANGELOG" | grep -oE '## \[[0-9]+\.[0-9]+\.[0-9]+\]' | head -1)
            echo "Changelog check passed — latest entry: $LATEST"
          fi

      - name: Rollback on failure
        if: failure()
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: production
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ~/app
            if [ ! -f .previous_image_tag ]; then
              echo "ERROR: No previous image tag found — cannot rollback"
              exit 1
            fi
            ROLLBACK_TAG=$(cat .previous_image_tag)
            echo "Rolling back to: $ROLLBACK_TAG"
            docker pull ghcr.io/ilv78/art-world-hub:$ROLLBACK_TAG
            sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=$ROLLBACK_TAG/" .env
            docker compose up -d --remove-orphans
            echo "Waiting for rollback to be healthy..."
            for i in $(seq 1 60); do
              if docker compose exec -T app node -e "fetch('http://localhost:5000/health').then(r => { if (!r.ok) process.exit(1) })" 2>/dev/null; then
                echo "Rollback healthy after ${i}s"
                exit 0
              fi
              sleep 2
            done
            echo "Rollback health check failed"
            docker compose logs --tail=50 app
            exit 1

      - name: Notify Telegram
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DEPLOY_STATUS: ${{ job.status }}
          REPO_NAME: ${{ github.event.repository.name }}
          IMAGE_TAG: ${{ github.event.inputs.image_tag }}
          TRIGGERED_BY: ${{ github.actor }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then exit 0; fi
          if [ "$DEPLOY_STATUS" = "success" ]; then EMOJI="✅"; else EMOJI="❌"; fi
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            -d chat_id="${TELEGRAM_CHAT_ID}" \
            -d parse_mode="HTML" \
            -d text="@racu8_bot
          ${EMOJI} <b>Production deployment: ${DEPLOY_STATUS}</b> [${REPO_NAME}]
          Production address: https://vernis9.art
          Tag: <code>${IMAGE_TAG}</code>
          By: ${TRIGGERED_BY}"
